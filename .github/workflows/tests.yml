name: Tests

# Laeuft bei jedem Push auf main und in jedem Pull Request. Dauert wenige
# Sekunden -- die Testsuite braucht weder Netz noch Zugangsdaten, genau
# dafuer ist die Trennung zwischen reinen Funktionen und I/O-Schicht da.
#
# Nur main statt jedes Branches: Der Arbeitsbranch wird immer auf
# denselben Commit gezogen wie main. Ein Push auf beide startete sonst
# zwei identische Laeufe -- doppelt so viele Gelegenheiten, an einem
# Runner-Engpass zu scheitern, und doppelt so viele Mails. Am 05.10.
# scheiterte genau so der Zwilling eines gruenen Laufs ("The job was
# not acquired by Runner"), ohne einen einzigen Schritt ausgefuehrt zu
# haben.

on:
  push:
    branches: [main]
  pull_request:

# Nur lesen: Die Tests schreiben nichts -- weder Zustand noch Commit.
permissions:
  contents: read

# Ein neuer Push macht den Lauf des vorigen ueberfluessig.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # warum fest: check-timetable.yml
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Linter
        run: ruff check .

      # Prueft die Workflow-Dateien selbst: Ausdruecke, Kontexte, Rechte --
      # und ueber das auf dem Runner vorinstallierte shellcheck jeden
      # run-Block. Steht nicht in requirements.txt, weil der Bot-Job es nie
      # braucht.
      - name: Workflows pruefen
        run: |
          pip install actionlint-py==1.7.12.25
          actionlint

      - name: Tests
        run: python -m pytest
