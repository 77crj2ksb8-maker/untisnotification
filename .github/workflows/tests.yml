name: Tests

# Laeuft bei jedem Push und jedem Pull Request. Dauert wenige Sekunden --
# die Testsuite braucht weder Netz noch Zugangsdaten, genau dafuer ist die
# Trennung zwischen reinen Funktionen und I/O-Schicht da.

on:
  push:
  pull_request:

# Ein neuer Push macht den Lauf des vorigen ueberfluessig.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Linter
        run: ruff check .

      - name: Tests
        run: python -m pytest
