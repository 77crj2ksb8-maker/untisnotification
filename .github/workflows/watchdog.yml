name: Wachhund

# WARUM ES DIESEN WORKFLOW GIBT -- ein Job, der nie startet, kann sich auch
# nicht beschweren; und warum der Wachhund an derselben Cron-Mechanik haengt,
# die er bewacht: README.md, Abschnitt "Wenn etwas schiefgeht".
#
# Die Entscheidung selbst steht in bot.py (wachhund_befund) und ist dort
# getestet. Bis 2.8 stand sie hier als Bash -- ungetestet, und mit einer
# Frage, die seit der Selbst-Anmeldung der Kette Fehlalarm gaebe.

on:
  schedule:
    # Zweimal pro Stunde, zu krummen Minuten: Volle und halbe Stunden sind
    # bei GitHub am staerksten ueberbucht. Frueher stand hier "alle 4
    # Stunden" -- gemessen vom 24.09. bis 05.10. kamen die Laeufe im Median
    # alle 6,4 Stunden, im schlimmsten Fall nach 11,2. Der Wachhund leidet
    # unter derselben Duerre wie die Kette; mehr Gelegenheiten sind das
    # einzige Mittel dagegen. Ein ruhiger Lauf dauert Sekunden und meldet
    # nichts.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  # Lesen fuer die Lauf-Historie, Schreiben fuer den Neustart: Steht die
  # Kette, wirft der Wachhund sie selbst wieder an.
  actions: write

concurrency:
  group: untisbot-wachhund
  cancel-in-progress: false

jobs:
  nachsehen:
    runs-on: ubuntu-24.04   # warum fest: check-timetable.yml
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Laufkette pruefen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Absichtlich NUR die Telegram-Werte: Eine Stoermeldung braucht
          # kein WebUntis, siehe Config.from_env(telegram_only=True).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py wachhund \
            --quelle "Wachhund · $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
